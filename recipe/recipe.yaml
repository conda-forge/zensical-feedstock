context:
  version: "0.0.68"

package:
  name: zensical
  version: ${{ version }}

source:
  - url: https://pypi.org/packages/source/z/zensical/zensical-${{ version }}.tar.gz
    sha256: 2acf102837eabae9a375106ee729f99c0ac0d36255c00fdcdd64dcf41409965c
  - url: https://raw.githubusercontent.com/zensical/ui/refs/heads/master/LICENSE
    sha256: ac044e6db7ba08069f635afc1759b0ae11a7d47f79144a4ccdd16fc94ba47d1e
    file_name: LICENSE-zensical-ui

build:
  python:
    version_independent: true
    entry_points:
      - zensical=zensical.main:cli
  skip:
    - not (match(python, python_min ~ ".*") and is_abi3)
  script:
    env:
      CARGO_PROFILE_RELEASE_STRIP: symbols
      CARGO_PROFILE_RELEASE_LTO: fat
      CARGO: cargo-auditable-wrapper${{ '' if unix else '.bat' }}
    content:
      - if: unix
        then:
          - cp ${RECIPE_DIR}/cargo-auditable-wrapper.sh ${BUILD_PREFIX}/bin/cargo-auditable-wrapper
        else:
          - copy %RECIPE_DIR%\cargo-auditable-wrapper.bat %BUILD_PREFIX%\Library\bin\cargo-auditable-wrapper.bat
      # rustc picks up its x86_64 host default of linking via the bundled
      # rust-lld even when cross compiling to ppc64le, and rust-lld does not
      # understand the inline PLT relocations (R_PPC64_PLT16_HA, R_PPC64_PLTSEQ,
      # R_PPC64_PLTCALL) that gcc emits in the C sources of `ring`, which is
      # pulled in via ureq/rustls. Link with the GNU linker instead.
      # -C linker-features is only stable on x86_64, hence RUSTC_BOOTSTRAP.
      - if: target_platform == "linux-ppc64le"
        then:
          - export RUSTC_BOOTSTRAP=1
          - export CARGO_BUILD_RUSTFLAGS="${CARGO_BUILD_RUSTFLAGS} -Zunstable-options -C linker-features=-lld"
      - python -m pip install . -vv
      - cargo-bundle-licenses --format yaml --output ./THIRD_PARTY.yml
  number: 0

requirements:
  build:
    - ${{ stdlib('c') }}
    - ${{ compiler('c') }}
    - ${{ compiler('rust') }}
    - cargo-bundle-licenses
    - cargo-auditable
    - if: build_platform != target_platform
      then:
        - python
        - cross-python_${{ target_platform }}
        - maturin >=1.8,<2.0
  host:
    - python
    - python-abi3
    - pip
    - maturin >=1.8,<2.0
  run:
    - python
    - click >=8.1.8
    - deepmerge >=2.0
    - markdown >=3.7
    - pygments >=2.20
    - pymdown-extensions >=11.0
    - pyyaml >=6.0.2
    - tomli >=2.4.0
    - jinja2 >=3.1
    - pathspec >=1.0.4
tests:
  - python:
      imports:
        - zensical
      pip_check: true
      python_version:
        - ${{ python_min }}.*
        - '*'
  - package_contents:
      site_packages:
        - zensical/bootstrap/.github/workflows/docs.yml
        - zensical-${{ version }}.dist-info/*

  - script:
      content:
        - if: win
          then: abi3audit %SP_DIR%\zensical\zensical.pyd -s -v --assume-minimum-abi3 ${{ python_min }}
          else: abi3audit $SP_DIR/zensical/zensical.abi3.so -s -v --assume-minimum-abi3 ${{ python_min }}
    requirements:
      run:
        - abi3audit
  - script:
      - zensical --version

about:
  homepage: https://zensical.org
  summary: A modern static site generator by the creators of Material for MkDocs
  description: |
    Write your documentation in Markdown and create a professional static site for your Open Source or commercial project in minutes – searchable, customizable, more than 60 languages, for all devices.
  license: MIT
  license_file:
    - LICENSE.md
    - THIRD_PARTY.yml
    - python/zensical/templates/.icons/fontawesome/LICENSE.txt
    - python/zensical/templates/.icons/material/LICENSE
    - python/zensical/templates/.icons/octicons/LICENSE
    - python/zensical/templates/.icons/simple/LICENSE.md
    - python/zensical/templates/.icons/lucide/LICENSE
    - python/zensical/templates/assets/javascripts/LICENSE
    - LICENSE-zensical-ui
  documentation: https://zensical.org
  repository: https://github.com/zensical/zensical

extra:
  recipe-maintainers:
    - pavelzw
